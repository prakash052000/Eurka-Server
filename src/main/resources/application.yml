server:
  port: 8761

spring:
  application:
    name: EurekaServer

info:
  app:
    name: EurekaServer
    type: discovery
    port: 8761

eureka:
  instance:
    hostname: localhost
    instance-id: EurekaServer:8761
    prefer-ip-address: false
    metadata-map:
      unique-name: EurekaServer
      service-type: discovery
      port: 8761
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: EurekaServer
